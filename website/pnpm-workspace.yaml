packages:
  - vendor/yuri4n.dev/layers/docs
  - vendor/yuri4n.dev/packages/eslint-config

blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 525600

overrides:
  eslint-flat-config-utils: ^3.2.0

# Content uses Node 24's built-in SQLite; dependency build scripts stay off.
allowBuilds:
  '*': false
