name: Scala.js libraries

on:
  pull_request:
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - nuxt.config.ts
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
  push:
    branches: [main]
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - nuxt.config.ts
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7
          disk-cache: false
      - name: Install JavaScript dependencies
        # These library checks do not need Nuxt's postinstall preparation.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test Nuxt development integration
        run: node --test scripts/*.test.mjs
      - name: Test native, ZIO, Kyo, and optional schema APIs
        run: >-
          sbt -batch
          'zioH3Ext/test'
          'kyoH3Ext/test'
          'nativeConverterZIOSchemaExt/test'
          'zioH3SchemaExt/test'
          'nuxtsvr/test'
      - name: Link production example applications
        run: pnpm run scala:full
      - name: Check publication metadata
        run: |
          sbt -batch releaseCheck
          node scripts/check-release.mjs
      - name: Stage reusable libraries locally
        run: sbt -batch releasePublishLocal
      - name: Verify independent Maven consumers
        run: node scripts/check-consumers.mjs
