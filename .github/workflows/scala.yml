name: Scala.js libraries

on:
  pull_request:
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - packages/nuxt/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - examples/**
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
      - .github/workflows/npm.yml
  push:
    branches: [main]
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - packages/nuxt/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - examples/**
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
      - .github/workflows/npm.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7
          disk-cache: false
      - name: Install JavaScript dependencies
        # These library checks do not need Nuxt's postinstall preparation.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test Nuxt development integration
        run: node --test scripts/*.test.mjs packages/nuxt/test/*.test.mjs
      - name: Install the isolated h3 and storage test fixtures
        # Every scala-modules/exts/*/test-js directory: h3 for the h3, Kyo, ZIO and schema
        # suites, unstorage for the Kyo and ZIO storage suites.
        run: |
          for fixture in scala-modules/exts/*/test-js; do
            npm ci --prefix "$fixture" --ignore-scripts
          done
      - name: Test the native layer, the Kyo core, the ZIO adapter, schema bridges, storage and the ZIO example
        run: >-
          sbt -batch
          'h3Ext/test'
          'kyoH3Ext/test'
          'kyoNuxtHubExt/test'
          'nativeConverterKyoSchemaExt/test'
          'zioH3Ext/test'
          'zioNuxtHubExt/test'
          'nativeConverterZIOSchemaExt/test'
          'nativeConverterZIOJsonExt/compile'
          'zioMigrationsExt/compile'
          'nuxtsvr/test'
      - name: Link production example applications
        run: pnpm run scala:full
      - name: Check publication metadata
        # Pull requests may carry a -SNAPSHOT version; a tag (release.yml) always needs a concrete one.
        run: |
          sbt -batch releaseCheck
          node scripts/check-release.mjs --allow-snapshot
      - name: Stage reusable libraries locally
        run: sbt -batch releasePublishLocal
      - name: Verify independent Maven consumers
        run: node scripts/check-consumers.mjs
