name: Scala.js libraries

on:
  pull_request:
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - packages/nuxt/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - examples/**
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
      - .github/workflows/npm.yml
  push:
    branches: [main]
    paths:
      - scala-modules/**
      - project/**
      - build/**
      - packages/nuxt/**
      - scripts/**
      - build.sbt
      - version.sbt
      - .jvmopts
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - examples/**
      - .github/workflows/scala.yml
      - .github/workflows/release.yml
      - .github/workflows/npm.yml
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NUXT_TELEMETRY_DISABLED: '1'

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7
          disk-cache: false
      - name: Install JavaScript dependencies
        # These library checks do not need Nuxt's postinstall preparation.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test Nuxt development integration
        run: node --test scripts/*.test.mjs packages/nuxt/test/*.test.mjs
      - name: Install the isolated h3 and storage test fixtures
        # Every scala-modules/exts/*/test-js directory: h3 for the h3, Kyo, ZIO and schema
        # suites, unstorage for the Kyo and ZIO storage suites.
        run: |
          for fixture in scala-modules/exts/*/test-js; do
            npm ci --prefix "$fixture" --ignore-scripts
          done
      - name: Test the native layer, the Kyo core, the ZIO adapter, schema bridges, storage and the ZIO example
        run: >-
          sbt -batch
          'h3Ext/test'
          'kyoH3Ext/test'
          'kyoNuxtHubExt/test'
          'nativeConverterKyoSchemaExt/test'
          'zioH3Ext/test'
          'zioNuxtHubExt/test'
          'nativeConverterZIOSchemaExt/test'
          'nativeConverterZIOJsonExt/compile'
          'zioMigrationsExt/compile'
          'nuxtsvr/test'
      - name: Link production example applications
        run: pnpm run scala:full
      - name: Check publication metadata
        # Pull requests may carry a -SNAPSHOT version; a tag (release.yml) always needs a concrete one.
        run: |
          sbt -batch releaseCheck
          node scripts/check-release.mjs --allow-snapshot
      - name: Stage reusable libraries locally
        run: sbt -batch releasePublishLocal
      - name: Verify independent Maven consumers
        run: node scripts/check-consumers.mjs

  # claude 2026-10-19: created: the demo and the database guide's kyo-sql code against PostgreSQL 16 (issue #29)
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: h34s
          POSTGRES_DB: h34s
          # A throwaway password for this job's database only. It is not a secret.
          POSTGRES_PASSWORD: h34s-ci-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U h34s -d h34s"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NUXT_DATABASE_HOST: 127.0.0.1
      NUXT_DATABASE_PORT: '5432'
      NUXT_DATABASE_USER: h34s
      NUXT_DATABASE_NAME: h34s
      NUXT_DATABASE_PASSWORD: h34s-ci-only
      PGPASSWORD: h34s-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7
          disk-cache: false
      - name: Install JavaScript dependencies with their install scripts
        # The Nuxt build needs the better-sqlite3 addon and `nuxt prepare`.
        run: pnpm install --frozen-lockfile
      - name: Check SCRAM authentication and apply the example schema
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U h34s -d h34s -tAc "select left(rolpassword, 14) from pg_authid where rolname = 'h34s'" | grep -Fx 'SCRAM-SHA-256$'
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U h34s -d h34s -f examples/nuxt/scala/zio/src/main/resources/sql/01-init.sql
      - name: Run the database guide's kyo-sql code
        env:
          H34S_POSTGRES_URL: postgres://h34s:h34s-ci-only@127.0.0.1:5432/h34s
          # Fail instead of skipping when the URL is missing.
          H34S_POSTGRES_REQUIRED: 'true'
        run: sbt -batch kyoExample/test
      - name: Build the example for production
        run: pnpm build
      - name: Serve the build, run the smoke checks, and stop it with SIGTERM
        working-directory: examples/nuxt
        run: |
          set -euo pipefail
          sessions() {
            psql -h 127.0.0.1 -U h34s -d h34s -tAc "select count(*) from pg_stat_activity where usename = 'h34s' and pid <> pg_backend_pid()"
          }
          node .output/server/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true; cat "$RUNNER_TEMP/server.log"' EXIT
          for _ in $(seq 60); do curl -fs -o /dev/null http://127.0.0.1:3000/api/test && break; sleep 1; done
          node ../../scripts/smoke.mjs
          requests=()
          for _ in $(seq 8); do curl -fsS -o /dev/null http://127.0.0.1:3000/api/notes & requests+=($!); done
          for request in "${requests[@]}"; do wait "$request"; done
          open=$(sessions)
          echo "Open sessions before SIGTERM: $open"
          test "$open" -gt 0
          kill -TERM "$server"
          status=0
          wait "$server" || status=$?
          echo "Server exit status: $status"
          test "$status" -eq 0
          for _ in $(seq 20); do [ "$(sessions)" -eq 0 ] && break; sleep 0.5; done
          echo "Open sessions after SIGTERM: $(sessions)"
          test "$(sessions)" -eq 0
