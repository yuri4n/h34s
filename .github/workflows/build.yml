name: Build foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "1"
      NUXT_TELEMETRY_DISABLED: "1"
      JAVA_OPTS: "-Xmx2G -Xss4M"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
      - name: Check the locked development toolchain
        run: nix flake check --no-update-lock-file
      - name: Install dependencies, test, and build through the shared pipeline
        run: nix develop --no-update-lock-file --command bash scripts/ci-build.sh
