name: Release Scala.js libraries

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/scala.yml
    permissions:
      contents: read

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      CI: 'true'
      NUXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: 1.11.7
          disk-cache: false
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the tag and publication metadata
        run: |
          sbt -batch releaseCheck
          node scripts/check-release.mjs
      - name: Publish reusable libraries to private GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: sbt -batch releasePublish
      - name: Verify consumers against the published registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-consumers.mjs --published

  release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the GitHub prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?$ ]]; then
            echo "Release tag must be a semantic version prefixed by v" >&2
            exit 1
          fi
          release_version="${RELEASE_TAG#v}"
          notes_file=".github/release-notes/${release_version}.md"
          test -f "$notes_file"
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --prerelease \
            --title "h34s $RELEASE_TAG" \
            --notes-file "$notes_file"
