name: Documentation website

on:
  pull_request:
    # claude 2026-10-20: changed: the site and the guides live in docs/ (issue #25); docs/** covers the submodule at docs/vendor/yuri4n.dev
    paths:
      - docs/**
      - examples/nuxt/scala/**
      # claude 2026-10-20: created: the project tour reads two regions of this file (issue #52)
      - examples/nuxt/nuxt.config.ts
      - .gitmodules
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/docs.yml
  push:
    branches: [main]
    # claude 2026-10-20: changed: the same paths as for pull requests (issue #25)
    paths:
      - docs/**
      - examples/nuxt/scala/**
      # claude 2026-10-20: created: the project tour reads two regions of this file (issue #52)
      - examples/nuxt/nuxt.config.ts
      - .gitmodules
      - pnpm-workspace.yaml
      - pnpm-lock.yaml
      - package.json
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    uses: yuri4n/yuri4nized-nuxt/.github/workflows/docs-ci.yml@v0.1.0
    # claude 2026-10-20: changed: the site's directory is docs/ (issue #25)
    with:
      working-directory: docs
      install-directory: docs
      library-path: docs/vendor/yuri4n.dev
      library-repository: yuri4n/yuri4nized-nuxt
      build-command: pnpm run ci
      nitro-preset: vercel
      output-dir: .vercel/output/static
