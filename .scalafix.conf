# Scalafix rules for every sbt project in this repository.
# Apply them with `sbt scalafixAll`; report only with `sbt "scalafixAll --check"`.
# OrganizeImports (with removeUnused) and RemoveUnused read SemanticDB; build.sbt enables
# it for every project, together with `-Wunused:all`.
rules = [
  OrganizeImports
  RemoveUnused
  RedundantSyntax
  DisableSyntax
]

OrganizeImports {
  targetDialect = Scala3
  # One import per prefix. Merge also when a selector renames or hides a name.
  groupedImports = AggressiveMerge
  removeUnused = true
  # The default groups keep the current layout: project and third-party imports first,
  # then a blank line, then `java` and `scala`.
}

RemoveUnused {
  # OrganizeImports already removes unused imports; do not run both on them.
  imports = false
}

DisableSyntax {
  noReturns = true
  noFinalize = true
  noXml = true
  noTabs = true
  # Not enabled on purpose: `null`, `var`, `throw`, `asInstanceOf` and `while` are part of the
  # JavaScript interop in the native layer and of the code that wraps it; the test suites
  # use `a; b` on one line.
}
