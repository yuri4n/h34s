version = "3.7.15"

runner.dialect = scala3
align.preset   = most
maxColumn      = 100

indent {
  significant = 4
}

comments {
  wrap = trailing
  wrapSingleLineMlcAsSlc = true
}

docstrings {
  style = SpaceAsterisk
  oneline = fold
}

rewrite {
  scala3 {
    convertToNewSyntax = true
    removeOptionalBraces = true
    removeEndMarkerMaxLines = 9
    insertEndMarkerMinLines = 10
  }
  rules = [AsciiSortImports]
  trailingCommas.style = always
}

fileOverride { ".sbt" { runner.dialect = sbt1 } }

fileOverride {
  "glob:project/*.scala" {
    runner.dialect = scala213
  }
}
