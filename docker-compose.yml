version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: my_app_postgres
    restart: unless-stopped
    ports:
      - "${MY_APP_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${MY_APP_DB_USER}
      POSTGRES_PASSWORD: ${MY_APP_DB_PASSWORD}
      POSTGRES_DB: ${MY_APP_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scala-modules/svr/src/main/resources/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MY_APP_DB_USER} -d ${MY_APP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
